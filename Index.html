  "Eye, Ear & ENT":"◈","Infectious Diseases":"◇","Skin Conditions":"✦"
};

let activeCategory = "All";

function buildFilters() {
  const container = document.getElementById('filters');
  const cats = ["All", ...new Set(codes.map(c => c.category))];
  cats.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (cat === 'All' ? ' active' : '');
    btn.textContent = cat === 'All' ? 'All Codes' : cat;
    btn.onclick = () => {
      activeCategory = cat;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCodes();
    };
    container.appendChild(btn);
  });
}

function filterCodes() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = codes.filter(item => {
    const matchCat = activeCategory === 'All' || item.category === activeCategory;
    const matchQ = !q || item.intention.toLowerCase().includes(q) || item.code.includes(q) || item.category.toLowerCase().includes(q);
    return matchCat && matchQ;
  });
  const badge = document.getElementById('countBadge');
  badge.textContent = filtered.length + ' of ' + codes.length + ' Codes · 14 Categories';
  if (filtered.length === 0) {
    document.getElementById('main').innerHTML = '<div class="empty">No codes found. Try a different search.</div>';
    return;
  }
  const groups = {};
  filtered.forEach(item => {
    if (!groups[item.category]) groups[item.category] = [];
    groups[item.category].push(item);
  });
  let html = '';
  Object.entries(groups).forEach(([cat, items]) => {
    html += '<div class="group-header"><div class="group-header-line"></div><div class="group-title">' + (categoryEmojis[cat]||'·') + ' ' + cat + '</div><div class="group-header-line" style="background:linear-gradient(90deg,transparent,var(--gold-dim));"></div></div>';
    items.forEach(item => {
      html += '<div class="code-card"><div class="code-info"><div class="code-intention">' + item.intention + '</div><div class="code-number">' + item.code + '</div></div><button class="copy-btn" onclick="copyCode(this,\'' + item.code.replace(/'/g,"\\'") + '\')">Copy</button></div>';
    });
  });
  document.getElementById('main').innerHTML = html;
}

function copyCode(btn, code) {
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = 'Copied'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
  }).catch(() => {
    const el = document.createElement('textarea');
    el.value = code; document.body.appendChild(el); el.select();
    document.execCommand('copy'); document.body.removeChild(el);
    btn.textContent = 'Copied'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
  });
}

buildFilters();
filterCodes();
